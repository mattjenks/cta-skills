receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch:
    timeout: 1s
  # Claude Code may export delta counters; Prometheus remote write needs cumulative.
  deltatocumulative: {}

exporters:
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
    resource_to_telemetry_conversion: { enabled: true }
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls: { insecure: true }
  # Archive of every signal. Contains prompt text: private.
  file:
    path: /archive/otel.jsonl
    format: json
    rotation:
      localtime: true
      max_megabytes: 100
      max_days: 3
      max_backups: 0

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [deltatocumulative, batch]
      exporters: [prometheusremotewrite, file]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/loki, file]
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo, file]
