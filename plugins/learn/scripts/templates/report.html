<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly learn report $date</title>
<style>
body { font-family: -apple-system, "Segoe UI", sans-serif; color: #1c1c1e; max-width: 720px; margin: 0 auto; padding: 16px; line-height: 1.45; }
h1 { font-size: 1.3em; margin: 0 0 4px; }
h2 { font-size: 1.05em; margin: 24px 0 6px; border-bottom: 1px solid #d0d0d5; padding-bottom: 3px; }
table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #e4e4e8; }
.status { padding: 8px 12px; border-radius: 6px; font-weight: 600; }
.green { background: #e3f4e6; color: #14532d; }
.amber { background: #fdf0d2; color: #6b4500; }
.red { background: #fbe0e0; color: #7f1d1d; }
code { background: #f1f1f4; padding: 0 3px; border-radius: 3px; }
</style>
</head>
<body>
<h1>Weekly learn report $date</h1>
$body
<p class="decide">Open <code>/cta-reports</code> in Claude Code to decide these recommendations.</p>
</body>
</html>
